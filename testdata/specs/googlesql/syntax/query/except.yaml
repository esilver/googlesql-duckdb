spec: docs/specs/googlesql/syntax/query/except.md
dialect: googlesql
cases:
  - desc: EXCEPT DISTINCT removes shared rows
    sql: |-
      (SELECT 1 AS x UNION ALL SELECT 2 UNION ALL SELECT 3)
      EXCEPT DISTINCT
      (SELECT 2)
    expected:
      # EXCEPT DISTINCT has no ORDER BY, so GoogleSQL leaves the row order
      # unspecified. DuckDB's hash set-difference emits these rows in an
      # arbitrary, run-to-run-unstable order (same flaky class as UNION /
      # INTERSECT DISTINCT), so assert set-equality on 1,3 rather than a
      # fixed sequence.
      unordered: true
      rows:
        - [1]
        - [3]
