spec: docs/specs/googlesql/functions/window/percentile_cont.md
dialect: googlesql
cases:
  - desc: continuous median of [1, 2, 3] is 2.0
    sql: SELECT PERCENTILE_CONT(x, 0.5) OVER () FROM UNNEST([1.0,2.0,3.0]) AS x LIMIT 1
    expected:
      rows:
        - [2.0]
  - desc: RESPECT NULLS treats NULL as minimum
    sql: SELECT PERCENTILE_CONT(x, 0 RESPECT NULLS) OVER () FROM UNNEST([NULL, 1.0]) AS x LIMIT 1
    expected:
      rows:
        - [null]
