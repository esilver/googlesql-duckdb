spec: docs/specs/googlesql/functions/aggregate/array_agg.md
dialect: googlesql
cases:
  - desc: aggregate ints into array
    sql: SELECT ARRAY_AGG(x ORDER BY x) FROM UNNEST([3, 1, 2]) AS x
    expected:
      rows:
        - [[1, 2, 3]]
  - desc: empty input returns NULL
    sql: SELECT ARRAY_AGG(x) FROM UNNEST(CAST([] AS ARRAY<INT64>)) AS x
    expected:
      rows:
        - [null]
  - desc: window distinct aggregate deduplicates
    sql: |
      SELECT TO_JSON_STRING(ARRAY_AGG(DISTINCT x) OVER (PARTITION BY g))
      FROM (SELECT 1 AS g, 1 AS x UNION ALL SELECT 1, 1 UNION ALL SELECT 1, 2)
      LIMIT 1
    expected:
      rows:
        - ["[1,2]"]
