spec: docs/specs/googlesql/functions/datetime/datetime_trunc.md
dialect: googlesql
cases:
  - desc: trunc to hour
    sql: SELECT CAST(DATETIME_TRUNC(DATETIME "2024-03-15T12:30:45", HOUR) AS STRING)
    expected:
      rows:
        - ["2024-03-15 12:00:00"]
  - desc: trunc to Monday week
    sql: SELECT CAST(DATETIME_TRUNC(DATETIME "2017-11-05T12:30:00", WEEK(MONDAY)) AS STRING)
    expected:
      rows:
        - ["2017-10-30 00:00:00"]
  - desc: trunc to ISO year boundary
    sql: SELECT CAST(DATETIME_TRUNC(DATETIME "2015-06-15T12:30:00", ISOYEAR) AS STRING)
    expected:
      rows:
        - ["2014-12-29 00:00:00"]
