spec: docs/specs/googlesql/functions/datetime/extract.md
dialect: googlesql
cases:
  - desc: EXTRACT(HOUR FROM DATETIME)
    sql: SELECT EXTRACT(HOUR FROM DATETIME '2024-06-15 13:45:00')
    expected:
      rows:
        - [13]
  - desc: EXTRACT(WEEK(MONDAY) before first Monday returns week zero
    sql: SELECT EXTRACT(WEEK(MONDAY) FROM DATE '2026-01-01')
    expected:
      rows:
        - [0]
