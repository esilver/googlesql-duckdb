spec: docs/specs/spanner/functions/mysql_datetime/str_to_date.md
dialect: spanner
# STR_TO_DATE parses a string with the given MySQL-style format spec
# and returns a DATE (or TIMESTAMP, depending on the format). For
# the canonical 'yyyy-mm-dd' input with '%Y-%m-%d', the result
# round-trips through CAST(... AS STRING).
cases:
  - desc: parse yyyy-mm-dd
    sql: SELECT CAST(mysql.str_to_date('2020-12-25', '%Y-%m-%d') AS DATE) AS d
    expected:
      rows:
        - ['2020-12-25']
  - desc: parse minutes with MySQL percent-i token
    sql: SELECT CAST(CAST(mysql.str_to_date('2020-12-25 09:30:17', '%Y-%m-%d %h:%i:%s') AS DATETIME) AS STRING) AS dt
    expected:
      rows:
        - ['2020-12-25 09:30:17']
  - desc: parse full month name with MySQL percent-M token
    sql: SELECT CAST(mysql.str_to_date('December 25 2020', '%M %d %Y') AS DATE) AS d
    expected:
      rows:
        - ['2020-12-25']
