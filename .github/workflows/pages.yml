name: Pages

# Publishes the Playground to GitHub Pages on demand, without cutting a
# release. It runs the same wasm build and the same deploy-pages job as
# the release workflow, so a manual deploy matches what a tagged
# release would publish.
on:
  workflow_dispatch:

# The default token is read-only; the deploy-pages job widens it to
# exactly what the Pages deployment needs.
permissions:
  contents: read

# Shares the release workflow's group: only one Pages deployment may
# run at a time, and one in flight is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # wasm builds the js/wasm Playground engine through the reusable
  # workflow, exactly as the release workflow does.
  wasm:
    uses: ./.github/workflows/wasm.yml
    with:
      upload: true

  # deploy-pages is copied from the release workflow: it bundles the
  # static Playground site around the engine the wasm job built and
  # publishes it to GitHub Pages.
  deploy-pages:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the GitHub Pages deployment
      id-token: write  # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/playground/package-lock.json

      - name: Download the Playground engine
        uses: actions/download-artifact@v8
        with:
          name: playground-engine
          path: docs/playground/public

      - name: Bundle the static site
        working-directory: docs/playground
        run: |
          make deps
          make build/assets
          make build/page

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/playground/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
